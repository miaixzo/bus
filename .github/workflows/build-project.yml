name: Build Project

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to validate. Leave empty to read VERSION.'
        required: false
        default: ''
        type: string
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags-ignore:
      - '*'

env:
  COMPILER_RELEASE: '21'

permissions:
  contents: read

jobs:
  build:
    name: Build Modules (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.java }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        java: [ '21', '25' ]
    steps:
      - name: Check Out Code
        uses: actions/checkout@v5

      - name: Set Up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build Project
        uses: ./.github/actions/build-project
        with:
          version: ${{ inputs.version || '' }}
          compiler-release: ${{ env.COMPILER_RELEASE }}
