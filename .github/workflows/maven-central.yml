name: Maven Central

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish. Leave empty to read VERSION.'
        required: false
        default: ''
        type: string
  push:
    tags:
      - '*.*.*'

env:
  JAVA_VERSION: '25'
  COMPILER_RELEASE: '21'
  MAVEN_VERSION: '3.9.16'
  MAVEN_SHA512: '831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release Modules
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      is-prerelease: ${{ steps.release.outputs.is-prerelease }}
      modules: ${{ steps.build.outputs.modules }}
    steps:
      - name: Check Out Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve Release Version
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version || '' }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            VERSION="${REF_NAME#v}"
          else
            VERSION="$INPUT_VERSION"
          fi

          if [ ! -f VERSION ]; then
            echo "::error file=VERSION::VERSION file is required"
            exit 1
          fi

          VERSION_FILE="$(tr -d '[:space:]' < VERSION)"
          if [ -z "$VERSION_FILE" ]; then
            echo "::error file=VERSION::VERSION file is empty"
            exit 1
          fi

          if [ -z "$VERSION" ]; then
            VERSION="$VERSION_FILE"
          fi

          if [ "$VERSION_FILE" != "$VERSION" ]; then
            echo "::error file=VERSION::VERSION '$VERSION_FILE' does not match release version '$VERSION'"
            exit 1
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]]; then
            echo "::error::Invalid release version: $VERSION"
            exit 1
          fi

          if [[ "$VERSION" == *SNAPSHOT* ]]; then
            echo "::error::SNAPSHOT versions cannot be published: $VERSION"
            exit 1
          fi

          if [[ "$VERSION" == *-* ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is-prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

          echo "Version: $VERSION"
          echo "Pre-release: $IS_PRERELEASE"

      - name: Set Up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build Project
        id: build
        uses: ./.github/actions/build-project
        with:
          version: ${{ steps.release.outputs.version }}
          compiler-release: ${{ env.COMPILER_RELEASE }}

  publish:
    name: Publish to Maven Central
    needs: build
    if: ${{ github.repository == '818000/bus' }}
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://central.sonatype.com/publishing/deployments
    env:
      MAVEN_CENTRAL_TOKEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_TOKEN_USERNAME }}
      MAVEN_CENTRAL_TOKEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN_PASSWORD }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
    steps:
      - name: Check Out Code
        uses: actions/checkout@v5

      - name: Set Up Java and Maven Central Credentials
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_TOKEN_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # Maven 3.10.0 writes maven-metadata-local.xml into the Central staging
      # directory, which Sonatype rejects because it has no version-level POM.
      - name: Set Up Maven
        shell: bash
        run: |
          set -euo pipefail

          MAVEN_ARCHIVE="$RUNNER_TEMP/apache-maven-$MAVEN_VERSION-bin.tar.gz"
          MAVEN_URL="https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/$MAVEN_VERSION/apache-maven-$MAVEN_VERSION-bin.tar.gz"

          curl --fail --silent --show-error --location "$MAVEN_URL" --output "$MAVEN_ARCHIVE"
          echo "$MAVEN_SHA512  $MAVEN_ARCHIVE" | sha512sum --check --strict
          tar --extract --gzip --file "$MAVEN_ARCHIVE" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-$MAVEN_VERSION/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/apache-maven-$MAVEN_VERSION/bin/mvn" --version

      - name: Publish Project
        uses: ./.github/actions/maven-central
        with:
          modules: ${{ needs.build.outputs.modules }}
          compiler-release: ${{ env.COMPILER_RELEASE }}
        env:
          MAVEN_CENTRAL_TOKEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_TOKEN_USERNAME }}
          MAVEN_CENTRAL_TOKEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  github-release:
    name: Create GitHub Release
    needs: [ build, publish ]
    if: ${{ github.ref_type == 'tag' && needs.publish.result == 'success' }}
    permissions:
      contents: write
    uses: ./.github/workflows/create-release.yml
    with:
      tag: ${{ github.ref_name }}
      version: ${{ needs.build.outputs.version }}
      prerelease: ${{ needs.build.outputs.is-prerelease == 'true' }}
    secrets: inherit
